# Path to the MATLAB trim table (relative to the repository root)
mat_path: hj_reachability/systems/trim_table_Poly_ConcatVer4p0.mat
# State-dependent model-mismatch disturbance (quadratic envelope fit).
# Copy guam_disturbance_quadfit.mat to hj_reachability/systems/ and uncomment to enable.
quadfit_mat: hj_reachability/systems/guam_disturbance_quadfit.mat

hj_analysis_config:
  axis: lat             # lon or lat
  mode: brt             # brs / frs / brt / frt
  accuracy: very_high   # low / medium / high / very_high
  time: 1.5             # horizon (s); integration direction follows the mode
  uh_idx_start: 1       # uh_idx 1..28 <-> trim airspeed UH (ft/s); Config.u_idx_range in helperOC
  uh_idx_end: 20
  wh_idx: 3             # wh_idx 1..3 <-> trim vertical speed WH = [-7.5, 0, 11.67] (ft/s)

# Physical (absolute) actuator limits, from GUAM_Config in helperOC:
# lift rotors 0..1600 RPM, pusher 0..2000 RPM, surfaces +-30 deg
dynamics:
  input_min_Pi: 0.0          # lift rotor speed (rad/s)
  input_min_Pi_p: 0.0        # pusher rotor speed (rad/s)
  input_min_delta_a: -0.5236 # aileron (rad)
  input_min_delta_e: -0.5236 # elevator (rad)
  input_min_delta_r: -0.5236 # rudder (rad)
  input_min_delta_f: -0.5236 # flap (rad)

  input_max_Pi: 167.5516     # 1600 RPM
  input_max_Pi_p: 209.4395   # 2000 RPM
  input_max_delta_a: 0.5236
  input_max_delta_e: 0.5236
  input_max_delta_r: 0.5236
  input_max_delta_f: 0.5236

longitudinal:
  # States: [u (ft/s), w (ft/s), q (rad/s), theta (rad)], deviation from trim
  target_min_u: -3.0
  target_min_w: -3.0
  target_min_q: -0.10
  target_min_theta: -0.10

  target_max_u: 3.0
  target_max_w: 3.0
  target_max_q: 0.10
  target_max_theta: 0.10

  grid_min_u: -16.4042   # -5 m/s
  grid_min_w: -21.3255   # -6.5 m/s
  grid_min_q: -0.6109    # -35 deg/s
  grid_min_theta: -0.4363 # -25 deg

  grid_max_u: 16.4042    # +5 m/s
  grid_max_w: 21.3255    # +6.5 m/s
  grid_max_q: 0.6109     # +35 deg/s
  grid_max_theta: 0.4363  # +25 deg

  grid_number_u: 33      # dx ~1.03 ft/s
  grid_number_w: 51      # dx ~1.05 ft/s
  grid_number_q: 49      # dx ~0.025 rad/s
  grid_number_theta: 33  # dx ~0.027 rad

  # Delta_lift capped at 100 RPM, Delta_push capped at 300 RPM
  # Delta_push/surf 15 deg (no trip).
  input_min_Pi: -10.4720         # lift rotor speed (rad/s)
  input_min_Pi_p: -31.4159      # pusher rotor speed (rad/s)
  input_min_delta_e: -0.2618    # elevator (rad)
  input_min_delta_f: -0.2618    # flap (rad)

  input_max_Pi: 10.4720
  input_max_Pi_p: 31.4159
  input_max_delta_e: 0.2618
  input_max_delta_f: 0.2618

  # Additive per-state disturbance magnitude (Config.lon_dMax)
  dist_max: 0.0

lateral:
  # States: [v (ft/s), p (rad/s), r (rad/s), phi (rad)], deviation from trim
  target_min_v: -3.0    # (ft/s)
  target_min_p: -0.10   # (rad/s)
  target_min_r: -0.10   # (rad/s)
  target_min_phi: -0.10 # (rad)

  target_max_v: 3.0     # (ft/s)
  target_max_p: 0.10    # (rad/s)
  target_max_r: 0.10    # (rad/s)
  target_max_phi: 0.10  # (rad)

  grid_min_v: -16.4042   # -5 m/s
  grid_min_p: -1.2217    # -70 deg/s
  grid_min_r: -0.6109    # -35 deg/s
  grid_min_phi: -0.6981  # -40 deg

  grid_max_v: 16.4042    # +5 m/s
  grid_max_p: 1.2217     # +70 deg/s
  grid_max_r: 0.6109     # +35 deg/s
  grid_max_phi: 0.6981   # +40 deg

  grid_number_v: 33      # dx ~1.03 ft/s
  grid_number_p: 85      # dx ~0.025 rad/s
  grid_number_r: 49      # dx ~0.025 rad/s
  grid_number_phi: 39    # dx ~0.027 rad

  # Input perturbation limits about trim (+-Delta), from GUAM_Config:
  # Delta_lift capped at 100 RPM (aero validity). Delta_surf 15 deg (no trip).
  input_min_Pi: -10.4720      # lift rotor speed (rad/s) = -100 RPM
  input_min_delta_a: -0.2618 # aileron (rad)
  input_min_delta_r: -0.2618 # rudder (rad)

  input_max_Pi: 10.4720
  input_max_delta_a: 0.2618
  input_max_delta_r: 0.2618

  # Additive per-state disturbance magnitude (Config.lat_dMax)
  dist_max: 0.0
