# Path to the MATLAB trim table (relative to the repository root)
mat_path: hj_reachability/systems/trim_table_Poly_ConcatVer4p0.mat

hj_analysis_config:
  axis: lon             # lon or lat
  mode: brt             # brs / frs / brt / frt
  accuracy: very_high   # low / medium / high / very_high
  time: 1.5               # horizon (s); integration direction follows the mode / lom: 1.5s, lat: 1.0s, lom: 1.5s, lat: 1.0s
  uh_idx_start: 1       # uh_idx 1..28 <-> trim airspeed UH (ft/s); Config.u_idx_range in helperOC
  uh_idx_end: 20
  wh_idx: 3             # wh_idx 1..3 <-> trim vertical speed WH = [-7.5, 0, 11.67] (ft/s)

# Physical (absolute) actuator limits, from GUAM_Config in helperOC:
# lift rotors 0..1600 RPM, pusher 0..2000 RPM, surfaces +-30 deg
dynamics:
  input_min_Pi: 0.0          # lift rotor speed (rad/s)
  input_min_Pi_p: 0.0        # pusher rotor speed (rad/s)
  input_min_delta_a: -0.5236 # aileron (rad)
  input_min_delta_e: -0.5236 # elevator (rad)
  input_min_delta_r: -0.5236 # rudder (rad)
  input_min_delta_f: -0.5236 # flap (rad)

  input_max_Pi: 167.5516     # 1600 RPM
  input_max_Pi_p: 209.4395   # 2000 RPM
  input_max_delta_a: 0.5236
  input_max_delta_e: 0.5236
  input_max_delta_r: 0.5236
  input_max_delta_f: 0.5236

longitudinal:
  # States: [u (ft/s), w (ft/s), q (rad/s), theta (rad)], deviation from trim
  # Target set settings (Config.lon_target_ub in helperOC)
  target_min_u: -3.0
  target_min_w: -1.0
  target_min_q: -0.05
  target_min_theta: -0.05

  target_max_u: 3.0
  target_max_w: 1.0
  target_max_q: 0.05
  target_max_theta: 0.05

  # Grid settings (Config.lon_grid_max / lon_grid_num in helperOC)
  # Bounds sized to the worst-case BRT reach over uh_idx 1..20 at time=1.5s
  # (measured extent u [-28,30], w [-47.2,28.5], q [-1.36,1.20], theta
  # [-1.04,1.16]) plus ~5-cell margin, so the tube stays inside the grid.
  # Each axis is aligned so that deviation 0 is a grid node (symmetric axes use
  # an odd count; w's bounds are integer multiples of dx). This places a node at
  # the target-set center so its signed-distance apex/kink (value -0.05) is
  # captured, and keeps dx near the previous resolution (u 1.0, w 0.75 ft/s;
  # q 0.043 rad/s, theta 0.044 rad).
  grid_min_u: -35.0     # (ft/s)
  grid_min_w: -52.5     # (ft/s)
  grid_min_q: -1.55     # (rad/s)
  grid_min_theta: -1.35 # (rad)

  grid_max_u: 35.0      # (ft/s)
  grid_max_w: 33.75     # (ft/s)
  grid_max_q: 1.55      # (rad/s)
  grid_max_theta: 1.35  # (rad)

  grid_number_u: 71     # dx=1.000 ft/s
  grid_number_w: 111    # dx=0.750 ft/s
  grid_number_q: 73     # dx=0.0431 rad/s
  grid_number_theta: 63 # dx=0.0435 rad

  # Input perturbation limits about trim (+-Delta), from GUAM_Config:
  # Delta_lift = 300 RPM, Delta_push = 500 RPM, Delta_surf = 15 deg
  input_min_Pi: -31.4159        # lift rotor speed (rad/s)
  input_min_Pi_p: -52.3598      # pusher rotor speed (rad/s)
  input_min_delta_e: -0.2618  # elevator (rad)
  input_min_delta_f: -0.2618  # flap (rad)

  input_max_Pi: 31.4159
  input_max_Pi_p: 52.3598
  input_max_delta_e: 0.2618
  input_max_delta_f: 0.2618

  # Additive per-state disturbance magnitude (Config.lon_dMax)
  dist_max: 0.0

lateral:
  # States: [v (ft/s), p (rad/s), r (rad/s), phi (rad)], deviation from trim
  # Target set settings (Config.lat_target_ub in helperOC)
  target_min_v: -3.0    # (ft/s)
  target_min_p: -0.05   # (rad/s)
  target_min_r: -0.05   # (rad/s)
  target_min_phi: -0.05 # (rad)

  target_max_v: 3.0     # (ft/s)
  target_max_p: 0.05    # (rad/s)
  target_max_r: 0.05    # (rad/s)
  target_max_phi: 0.05  # (rad)

  # Grid settings (Config.lat_grid_max / lat_grid_num in helperOC)
  grid_min_v: -25.0     # was -20.0
  grid_min_p: -8.0      # was -6.5
  grid_min_r: -0.25     # was -0.35  (과대 → 축소, 선택)
  grid_min_phi: -3.0    # was -2.4

  grid_max_v: 25.0
  grid_max_p: 8.0
  grid_max_r: 0.25
  grid_max_phi: 3.0

  grid_number_v: 51     # was 41   (dx≈1.0 ft/s 유지)
  grid_number_p: 371    # was 301  (dx≈0.043 rad/s 유지)
  grid_number_r: 15     # was 21   (dx≈0.036 유지)
  grid_number_phi: 139  # was 111  (dx≈0.043 rad 유지)
  
  
  # Input perturbation limits about trim (+-Delta), from GUAM_Config:
  # Delta_lift = 120 RPM, Delta_surf = 10 deg
  input_min_Pi: -12.5664     # lift rotor speed (rad/s)
  input_min_delta_a: -0.2618 # aileron (rad)
  input_min_delta_r: -0.2618 # rudder (rad)

  input_max_Pi: 12.5664
  input_max_delta_a: 0.2618
  input_max_delta_r: 0.2618

  # Additive per-state disturbance magnitude (Config.lat_dMax)
  dist_max: 0.0
