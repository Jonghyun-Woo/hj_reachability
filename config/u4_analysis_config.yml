# Path to the MATLAB trim corridor results (relative to the hj_reachability root)
mat_path: hj_reachability/systems/U4_TrimLinear_mcode.mat
# State-dependent model-mismatch disturbance (quadratic envelope fit).
# Copy u4_disturbance_quadfit.mat to hj_reachability/systems/ and uncomment to enable.
quadfit_mat: hj_reachability/systems/u4_disturbance_quadfit.mat

hj_analysis_config:
  axis: lon             # lon or lat
  mode: brt             # brs / frs / brt / frt
  accuracy: high        # low / medium / high / very_high
  time: 0.5             # horizon (s); integration direction follows the mode / lon: 0.5s
  trim_idx_start: 1     # trim_idx 1..19 <-> tilt angle 0:5:90 (deg)
  trim_idx_end: 19

# Physical (absolute) actuator limits, keyed by actuator type
# (thr: EDF throttle %, ail: aileron, rv: ruddervator L/R, tilt: EDF tilt)
dynamics:
  input_min_thr: 0.0        # (%)
  input_min_ail: -0.5236    # (rad)
  input_min_rv: -0.6981     # (rad)
  input_min_tilt: -0.1745   # (rad)

  input_max_thr: 100.0
  input_max_ail: 0.5236
  input_max_rv: 0.6981
  input_max_tilt: 1.7453

longitudinal:
  # States: [u (m/s), w (m/s), q (rad/s), theta (rad)], deviation from trim
  # Target set settings
  target_min_u: -1.0
  target_min_w: -1.0
  target_min_q: -0.0873
  target_min_theta: -0.0873

  target_max_u: 1.0
  target_max_w: 1.0
  target_max_q: 0.0873
  target_max_theta: 0.0873

  # Grid settings
  grid_min_u: -5.0         # (m/s)
  grid_min_w: -12.0        # (m/s)
  grid_min_q: -4.7123      # (rad/s)
  grid_min_theta: -0.5236  # (rad)

  grid_max_u: 5.0          # (m/s)
  grid_max_w: 12.0         # (m/s)
  grid_max_q: 4.7123       # (rad/s)
  grid_max_theta: 0.5236   # (rad)

  grid_number_u: 41
  grid_number_w: 81
  grid_number_q: 61
  grid_number_theta: 31

  input_min_thr: -10.0    # (%)
  input_min_ail: -0.0     # (rad)
  input_min_rv: -0.1745   # (rad)
  input_min_tilt: -0.0873 # (rad)

  input_max_thr: 10.0     # (%)
  input_max_ail: 0.0      # (rad)
  input_max_rv: 0.1745    # (rad)
  input_max_tilt: 0.0873  # (rad)

  # Additive per-state disturbance bounds; d_i in [min, max] is added to
  # dx/dt (see U4Linear.disturbance_jacobian). All 0 means no disturbance.
  dist:
    u:
      min: -0.7    # (m/s^2)
      max: 0.7
    w:
      min: -0.7    # (m/s^2)
      max: 0.7
    q:
      min: -0.5236    # (rad/s^2)
      max: 0.5236
    theta:
      min: 0.0     # (rad/s)
      max: 0.0

lateral:
  # States: [v (m/s), p (rad/s), r (rad/s), phi (rad)], deviation from trim
  # Target set settings
  target_min_v: -1.0      # (m/s)
  target_min_p: -0.0525   # (rad/s)
  target_min_r: -0.0525   # (rad/s)
  target_min_phi: -0.0525 # (rad)

  target_max_v: 1.0       # (m/s)
  target_max_p: 0.0525    # (rad/s)
  target_max_r: 0.0525    # (rad/s)
  target_max_phi: 0.0525  # (rad)

  # Grid settings
  grid_min_v: -5.0        # (m/s)
  grid_min_p: -1.0472     # (rad/s)
  grid_min_r: -1.0472     # (rad/s)
  grid_min_phi: -0.5236   # (rad)

  grid_max_v: 5.0         # (m/s)
  grid_max_p: 1.0472      # (rad/s)
  grid_max_r: 1.0472      # (rad/s)
  grid_max_phi: 0.5236    # (rad)

  grid_number_v: 41
  grid_number_p: 61
  grid_number_r: 61
  grid_number_phi: 61

  # Input perturbation limits about trim (+-Delta), per actuator type.
  input_min_thr: -10.0       # (%)
  input_min_ail: -0.1745     # (rad)
  input_min_rv: -0.1745      # (rad)
  input_min_tilt: -0.0873    # (rad)

  input_max_thr: 10.0        # (%)
  input_max_ail: 0.1745      # (rad)
  input_max_rv: 0.1745       # (rad)
  input_max_tilt: 0.0873     # (rad)

  # Additive per-state disturbance bounds; d_i in [min, max] is added to
  # dx/dt (see U4Linear.disturbance_jacobian). All 0 means no disturbance.
  dist:
    v:
      min: 0.0     # (m/s^2)
      max: 0.0
    p:
      min: 0.0     # (rad/s^2)
      max: 0.0
    r:
      min: 0.0     # (rad/s^2)
      max: 0.0
    phi:
      min: 0.0     # (rad/s)
      max: 0.0
