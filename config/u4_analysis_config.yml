# Path to the MATLAB trim corridor results (relative to the repository root)
# mat_path: hj_reachability/systems/Trim_Corridor_Results.mat
mat_path: hj_reachability/systems/U4_TrimLinear_mcode.mat

hj_analysis_config:
  axis: lon             # lon or lat
  mode: brt             # brs / frs / brt / frt
  accuracy: very_high   # low / medium / high / very_high
  time: 1               # horizon (s); integration direction follows the mode / lat: 0.05s / lon: 1s
  trim_idx_start: 1     # trim_idx 1..19 <-> tilt angle 0:5:90 (deg)
  trim_idx_end: 19

# Physical (absolute) actuator limits
dynamics:
  input_min_Pi: 0.0       # (%)
  input_min_tilt: -0.1745   # (rad)
  input_min_delta_a: -0.5236 # (rad)
  input_min_delta_e: -0.3291 # (rad)
  input_min_delta_r: -0.3291 # (rad)

  input_max_Pi: 100.0
  input_max_tilt: 1.7453
  input_max_delta_a: 0.5236
  input_max_delta_e: 0.3291
  input_max_delta_r: 0.3291

longitudinal:
  # States: [u (m/s), w (m/s), q (rad/s), theta (rad)], deviation from trim
  # Target set settings
  target_min_u: -1.0
  target_min_w: -1.0
  target_min_q: -0.09
  target_min_theta: -0.09

  target_max_u: 1.0
  target_max_w: 1.0
  target_max_q: 0.09
  target_max_theta: 0.09

  # Grid settings
  grid_min_u: -5.0      # (m/s)
  grid_min_w: -10.0     # (m/s)
  grid_min_q: -1        # (rad/s)
  grid_min_theta: -0.90 # (rad)

  grid_max_u: 5.0       # (m/s)
  grid_max_w: 10.0      # (m/s)
  grid_max_q: 1         # (rad/s)
  grid_max_theta: 0.90  # (rad)

  grid_number_u: 41
  grid_number_w: 81
  grid_number_q: 61
  grid_number_theta: 61

  # Input perturbation limits about trim (+-Delta)
  input_min_Pi: -20.0       # (%)
  input_min_delta_e: -0.2618 # (rad)
  input_min_tilt: -0.1745    # (rad)

  input_max_Pi: 20.0        # (%)
  input_max_delta_e: 0.2618  # (rad)
  input_max_tilt: 0.1745     # (rad)

  # Additive per-state disturbance magnitude
  dist_max: 0.0

lateral:
  # States: [v (m/s), p (rad/s), r (rad/s), phi (rad)], deviation from trim
  # Target set settings
  target_min_v: -1.0    # (m/s)
  target_min_p: -0.03   # (rad/s)
  target_min_r: -0.03   # (rad/s)
  target_min_phi: -0.03 # (rad)

  target_max_v: 1.0     # (m/s)
  target_max_p: 0.03    # (rad/s)
  target_max_r: 0.03    # (rad/s)
  target_max_phi: 0.03  # (rad)

  # Grid settings
  grid_min_v: -8.0      # (m/s)
  grid_min_p: -1.5      # (rad/s)
  grid_min_r: -1.5     # (rad/s)
  grid_min_phi: -1.5   # (rad)

  grid_max_v: 8.0       # (m/s)
  grid_max_p: 1.5       # (rad/s)
  grid_max_r: 1.5      # (rad/s)
  grid_max_phi: 1.5    # (rad)

  grid_number_v: 61
  grid_number_p: 81
  grid_number_r: 81
  grid_number_phi: 61

  # Input perturbation limits about trim (+-Delta)
  input_min_delta_a: -0.0873 # (rad)
  input_min_delta_r: -0.0873 # (rad)
  input_min_tilt: -0.0873    # (rad)

  input_max_delta_a: 0.0873  # (rad)
  input_max_delta_r: 0.0873  # (rad)
  input_max_tilt: 0.0873     # (rad)

  # Additive per-state disturbance magnitude
  dist_max: 0.0
